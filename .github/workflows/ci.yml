name: ci
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: json parses
        run: |
          rc=0
          while IFS= read -r f; do jq -e . "$f" >/dev/null || { echo "$f invalid" >&2; rc=1; }; done \
            < <(find . -name '*.json' -not -path './node_modules/*')
          exit $rc
      - name: eslint base is valid js
        run: |
          node --check eslint/base.js
      - name: package resolves as a consumer would
        run: |
          # pack, do not link: a path install symlinks the checkout and peers would not resolve from it
          d=$(mktemp -d); npm pack --pack-destination "$d" >/dev/null; cd "$d"
          printf '{ "name": "consumer", "private": true, "type": "module", "prettier": "@jakobmelchard/config/prettier" }\n' > package.json
          npm i --no-save ./jakobmelchard-config-*.tgz eslint@9 @eslint/js@9 eslint-plugin-jsdoc@50 typescript@5 prettier@3 @types/node@22 >/dev/null
          printf '/** @param {number} a\n * @returns {number} */\nexport function f(a) {\n  return a\n}\n' > ok.js
          printf 'import base from "@jakobmelchard/config/eslint"\nexport default [...base]\n' > eslint.config.js
          printf '{ "extends": "@jakobmelchard/config/tsconfig", "include": ["ok.js"] }\n' > tsconfig.json
          npx eslint ok.js && npx prettier --check ok.js && npx tsc -p tsconfig.json
          # the rules must bite: a function without JSDoc, a semicolon and a mismatched @param (an error, not
          # the preset's warning); the house block must hold: an unknown tag, an undefined type, an unused _ param
          # and an empty catch are not reported
          printf '/** @param {number} b */\nexport function g(a) {\n  return a;\n}\nexport function h() {}\n/**\n * @customtag\n * @param {Unknown} _x unused\n * @returns {number} n\n */\nexport function k(_x) {\n  try {\n    JSON.parse("x")\n  } catch {}\n  return 1\n}\n' > bad.js
          rules=$(npx eslint -f json bad.js | jq -r '[.[].messages[] | "\(.ruleId):\(.severity)"] | sort | join(" ")')
          [ "$rules" = "jsdoc/check-param-names:2 jsdoc/require-jsdoc:1 jsdoc/require-param-description:1 jsdoc/require-param:1 jsdoc/require-returns:1" ] || { echo "got: $rules" >&2; exit 1; }
          ! npx prettier --check bad.js

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
