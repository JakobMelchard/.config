name: ci
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: json parses
        run: |
          rc=0
          while IFS= read -r f; do jq -e . "$f" >/dev/null || { echo "$f invalid" >&2; rc=1; }; done \
            < <(find . -name '*.json' -not -path './node_modules/*')
          exit $rc
      - name: eslint base is valid js and manifest sources exist
        run: |
          node --check eslint/base.js
          while IFS= read -r s; do [ -f "$s" ] || { echo "manifest: missing $s" >&2; exit 1; }; done \
            < <(jq -r '.files + .examples + (.opt_in // {}) | keys[]' manifest.json)
      - name: generated tokens are current
        run: |
          python3 tokens/build_tokens.py
          # status, not diff: an output the generator adds but nobody committed is drift too
          [ -z "$(git status --porcelain -- tokens)" ] || { git status --short -- tokens; echo "tokens/ outputs stale: run tokens/build_tokens.py and commit" >&2; exit 1; }
          ! grep -q "data-theme='light'" tokens/tokens-dark.css || { echo "tokens-dark.css carries a light block" >&2; exit 1; }
      - name: package resolves as a consumer would
        run: |
          # pack, do not link: a path install symlinks the checkout and peers would not resolve from it
          d=$(mktemp -d); npm pack --pack-destination "$d" >/dev/null; cd "$d"
          printf '{ "name": "consumer", "private": true, "type": "module", "prettier": "@jakobmelchard/config/prettier" }\n' > package.json
          npm i --no-save ./jakobmelchard-config-*.tgz eslint@9 @eslint/js@9 eslint-plugin-jsdoc@50 typescript@5 prettier@3 @types/node@22 >/dev/null
          printf '/** @param {number} a\n * @returns {number} */\nexport function f(a) {\n  return a\n}\n' > ok.js
          printf 'import base from "@jakobmelchard/config/eslint"\nexport default [...base]\n' > eslint.config.js
          printf '{ "extends": "@jakobmelchard/config/tsconfig", "include": ["ok.js"] }\n' > tsconfig.json
          npx eslint ok.js && npx prettier --check ok.js && npx tsc -p tsconfig.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; import { fileURLToPath } from 'node:url'; for (const f of ['tokens.css', 'tokens-dark.css']) readFileSync(fileURLToPath(import.meta.resolve('@jakobmelchard/config/' + f)))"

  shell:
    uses: JakobMelchard/.github/.github/workflows/shell.yml@main
    with:
      paths: scripts
      severity: warning

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
          path: .bats
          persist-credentials: false
      # the tools source the shared lib from JakobMelchard/.github (public)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JakobMelchard/.github
          path: .org-github
          persist-credentials: false
      - env:
          JM_LIB: ${{ github.workspace }}/.org-github/scripts/lib
        run: .bats/bin/bats scripts/test

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@main
