name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@da5c1f89e2029e3f3e7a39a5dc1c9f9d5ad2084e # v2.2.3
    # melchbot (not github.token) tags, so the tag triggers publish.yml. A called workflow cannot
    # hold more permissions than its caller, so they are repeated here.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
