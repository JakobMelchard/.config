name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    # melchbot (not github.token) tags, so the tag triggers publish.yml. A called workflow cannot
    # hold more permissions than its caller, so they are repeated here.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
