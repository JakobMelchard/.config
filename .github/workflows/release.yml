name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    # melchbot (not github.token) tags, so the tag triggers publish.yml. A called workflow cannot
    # hold more permissions than its caller, so they are repeated here.
    permissions:
      contents: read
      id-token: write
